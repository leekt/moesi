name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require exact checked-out head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0

      - name: Verify JavaScript toolchain
        run: |
          test "$(node --version)" = "v22.18.0"
          test "$(pnpm --version)" = "11.15.1"

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check source workspace
        run: pnpm check

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Install public package runtime floor
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0

      - name: Verify public package runtime floor
        run: |
          test "$(node --version)" = "v22.13.0"
          test "$(pnpm --version)" = "11.15.1"

      - name: Check packed consumers
        run: |
          node scripts/smoke-packed-library.mjs
          node scripts/smoke-packed-cli.mjs

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
          cache: false

      - name: Verify Anvil
        run: anvil --version

      - name: Check core local onchain behavior
        working-directory: packages/moesi
        run: pnpm test:anvil

      - name: Check CLI process recovery
        run: node scripts/test-cli-anvil.mjs

      - name: Check packed library onchain lifecycle
        run: node scripts/test-packed-anvil.mjs

      - name: Require a clean generated state
        run: test -z "$(git status --porcelain --untracked-files=all)"
